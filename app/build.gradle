plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wearly.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.wearly.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.13.0'
}
